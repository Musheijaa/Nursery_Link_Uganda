name: Production

# Railway deploys each push to main; after CI passes on main, this confirms production runs it.
# This waits until the live API reports that commit in /health, then smoke-tests the public site,
# the admin console and the API. A failure here means production is not running the new code.
# The API has no public address of its own: it is reached through the sites' /api forwarding.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  # Set these repository variables (Settings → Secrets and variables → Actions → Variables) to the
  # Railway domains, e.g. https://nurserylink-web.up.railway.app
  WEB_URL: ${{ vars.PROD_WEB_URL }}
  ADMIN_URL: ${{ vars.PROD_ADMIN_URL }}

jobs:
  verify:
    name: Deployed and healthy
    if: ${{ vars.PROD_WEB_URL != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history, to tell whether this commit changed anything the API is built from
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Wait for the API to run this commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # Railway builds the image, then the API migrates and seeds before it answers: allow 25 minutes
          for i in $(seq 1 50); do
            body=$(curl -fsS --max-time 30 "$WEB_URL/api/v1/health" || true)
            commit=$(printf '%s' "$body" | jq -r '.data.commit // empty' 2>/dev/null || true)
            status=$(printf '%s' "$body" | jq -r '.data.status // empty' 2>/dev/null || true)
            echo "attempt $i: status=${status:-none} commit=${commit:-none}"
            if [ "$commit" = "$SHA" ] && [ "$status" = ok ]; then exit 0; fi
            # Railway skips redeploying the API when none of its watch paths changed (docs, the other
            # apps…); then the commit it runs is as good as this one
            if [ "$status" = ok ] && [ -n "$commit" ] && git cat-file -e "$commit^{commit}" 2>/dev/null; then
              paths=$(jq -r '.build.watchPatterns[] | ":(glob)" + .' deploy/railway/api.json)
              if git diff --quiet "$commit" "$SHA" -- $paths; then
                echo "The API runs $commit; nothing it is built from changed up to $SHA"
                exit 0
              fi
            fi
            sleep 30
          done
          echo "::error::The API did not report commit $SHA within 25 minutes. Check the deploy in the Railway dashboard."
          exit 1
      - name: Smoke test the live sites and API
        run: |
          check() { # url, text the response must contain
            code=$(curl -sS -o page.out -w '%{http_code}' --max-time 60 "$1")
            if [ "$code" != 200 ] || ! grep -q "$2" page.out; then echo "::error::$1 returned $code or lacks '$2'"; exit 1; fi
            echo "ok  $1"
          }
          check "$WEB_URL/" "Nursery Link"
          check "$WEB_URL/nurseries" "Nursery Link"
          check "$WEB_URL/api/v1/health" '"status":"ok"'
          check "$WEB_URL/api/v1/nurseries?limit=1" '"data"'
          check "$WEB_URL/api/v1/species?limit=1" '"data"'
          check "$WEB_URL/api/v1/docs/openapi.json" '"openapi"'
          check "$ADMIN_URL/" "Nursery Link"
          check "$ADMIN_URL/api/v1/health" '"status":"ok"'
